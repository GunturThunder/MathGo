# Local development: Postgres, Redis and the api. S3-07 adds game-server.
# Start with `docker compose up -d --wait`, then run `pnpm db:migrate`.
name: mathgo

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathgo}
      POSTGRES_DB: ${POSTGRES_DB:-mathgo}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-mathgo}:${POSTGRES_PASSWORD:-mathgo}@postgres:5432/${POSTGRES_DB:-mathgo}
      # Shared with game-server (S3-05). Local only: production sets its own.
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-not-for-production}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

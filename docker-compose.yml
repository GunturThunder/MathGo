# Local development: Postgres, Redis, api and game-server. `docker compose up -d --wait` starts
# everything and applies the database migrations (the one-shot `migrate` service).
name: mathgo

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathgo}
      POSTGRES_DB: ${POSTGRES_DB:-mathgo}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the database migrations once, then exits; api starts after it succeeds.
  migrate:
    build:
      context: .
      args: { APP: db }
    command: ['node', 'dist/migrate-cli.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mathgo}:${POSTGRES_PASSWORD:-mathgo}@postgres:5432/${POSTGRES_DB:-mathgo}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      args: { APP: api, PORT: 3000 }
    environment:
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-mathgo}:${POSTGRES_PASSWORD:-mathgo}@postgres:5432/${POSTGRES_DB:-mathgo}
      # Shared with game-server (S3-05). Local only: production sets its own.
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-not-for-production}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  game-server:
    build:
      context: .
      args: { APP: game-server, PORT: 2567 }
    environment:
      # Must match the api's, which signs the tokens game-server checks.
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-not-for-production}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-mathgo}:${POSTGRES_PASSWORD:-mathgo}@postgres:5432/${POSTGRES_DB:-mathgo}
    ports:
      - '127.0.0.1:${GAME_SERVER_PORT:-2567}:2567'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same Postgres as docker-compose.yml, so every PR proves the migrations apply.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mathgo
          POSTGRES_PASSWORD: mathgo
          POSTGRES_DB: mathgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathgo -d mathgo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://mathgo:mathgo@localhost:5432/mathgo

  api-image:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f apps/api/Dockerfile -t mathgo-api:ci .
      - name: GET /health returns 200 in Docker
        run: |
          # Production config: a real-looking secret and URL are required to start.
          # /health does not touch the database.
          docker run -d --name api -p 127.0.0.1:3000:3000 \
            -e JWT_SECRET=ci-only-secret-0123456789abcdefghijkl \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci \
            mathgo-api:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 1
          done
          docker logs api
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health)" = 200

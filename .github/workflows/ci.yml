name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same Postgres as docker-compose.yml, so every PR proves the migrations apply.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mathgo
          POSTGRES_PASSWORD: mathgo
          POSTGRES_DB: mathgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathgo -d mathgo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://mathgo:mathgo@localhost:5432/mathgo

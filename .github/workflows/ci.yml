name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same Postgres as docker-compose.yml, so every PR proves the migrations apply.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mathgo
          POSTGRES_PASSWORD: mathgo
          POSTGRES_DB: mathgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathgo -d mathgo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Invite codes (game-server); the Redis tests run when REDIS_URL is set.
      redis:
        image: redis:8.8.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://mathgo:mathgo@localhost:5432/mathgo

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The S3-07 check on a clean machine: one command builds and starts everything, and the
      # one-shot migrate service prepares the database.
      - name: docker compose up
        run: docker compose up -d --wait --build
      - name: api and game-server are healthy
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2567/health)" = 200
      - name: a guest can sign up (the migrations ran)
        run: |
          curl -sf -X POST http://127.0.0.1:3000/auth/guest \
            -H 'content-type: application/json' -d '{"birthYear":1990}' > /dev/null
      - name: Logs
        if: always()
        run: docker compose logs
